name: Daily scrape

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - run: python scripts/run_scrape.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
